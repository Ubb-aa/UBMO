name: Deploy UB MOVIES to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Site and Inject API URL
        env:
          SECRET_API_URL: ${{ secrets.API_URL }}
        run: |
          mkdir -p _site
          cp index.html _site/
          if [ -d "assets" ]; then cp -r assets _site/; fi
          sed -i "s|__API_URL__|${SECRET_API_URL}|g" _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
