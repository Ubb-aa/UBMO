name: Deploy UB MOVIES to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Site and Inject API URL
        env:
          SECRET_API_URL: ${{ secrets.API_URL }}
        run: |
          mkdir -p _site
          cp index.html _site/
          if [ -d "assets" ]; then cp -r assets _site/; fi
          sed -i "s|__API_URL__|${SECRET_API_URL}|g" _site/index.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
